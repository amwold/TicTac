name: tictac
description: Tic Tac Ultra HD Offline Game
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  fpdart: ^1.1.0
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  local_auth: ^2.3.0
  safe_device: ^1.1.6
  device_info_plus: ^10.1.2
  shared_preferences: ^2.3.2
  get_it: ^7.7.0
  intl: ^0.19.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/data/
    - assets/lang/
